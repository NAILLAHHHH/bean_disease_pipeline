# Round-robin load balancer in front of N API containers (docker compose --scale api=N)
events { worker_connections 4096; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;   # Docker DNS: re-resolve so scaled replicas are picked up
  client_max_body_size 200m;
  upstream api_pool { server api:8000; keepalive 64; }
  server {
    listen 80;
    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 600s;
    }
  }
}
