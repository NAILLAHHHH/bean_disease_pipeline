# Local multi-container deployment:
#   docker compose up --build --scale api=3
# Dashboard + API on http://localhost:8080
services:
  api:
    build: .
    image: bean-disease-api:latest
    environment:
      - RETRAIN_THRESHOLD=30
      - AUTO_RETRAIN=true
    volumes:
      # Bind mounts so the image's model and dataset are visible on first start.
      # Named volumes would hide the files copied into the image.
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 4g }
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on: [api]
