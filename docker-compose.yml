# Local multi-container deployment:
#   docker compose up --build --scale api=3
# Dashboard + API on http://localhost:8080
services:
  api:
    build: .
    image: bean-disease-api:latest
    environment:
      - RETRAIN_THRESHOLD=30
      - AUTO_RETRAIN=true
    volumes:
      - shared_models:/app/models      # every replica sees the promoted model
      - shared_data:/app/data          # uploads + training data shared by replicas
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5g }
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on: [api]
volumes:
  shared_models:
  shared_data:
